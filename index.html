}

.match-incorrect .match-slot-content {

    border: 1px solid var(--border-light);
}

.match-instructions span {
    display: inline-block;
    margin: 0 4px;
    padding: 2px 6px;
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
} 

/* Минималистичный снегопад */
#snowfall-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9998;
    overflow: hidden;
}

.snowflake {
    position: absolute;
    top: -20px;
    color: white;
    font-size: 1em;
    text-shadow: 0 0 3px rgba(255, 255, 255, 0.9);
    user-select: none;
    animation-name: snowfall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes snowfall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
    }
    100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}

/* Минималистичный поп-ап */
#celebration-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

#celebration-content {
    background: white;
    padding: 40px 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 500px;
    color: #1a1a1a;
    text-align: center;
    border: 2px solid #e0e0e0;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    position: relative;
}

.celebration-icon {
    font-size: 3.5rem;
    margin-bottom: 15px;
    display: block;
    animation: bounce 1s ease infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-10px); }
}

.celebration-title {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: #1a1a1a;
    letter-spacing: -0.02em;
}

.celebration-message {
    font-size: 1.1rem;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #666;
    font-weight: 400;
}

/* Кнопка закрытия */
.celebration-close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f8f9fa;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    transition: all 0.2s ease;
}

.celebration-close:hover {
    background: #f0f0f0;
    color: #333;
}

@media (max-width: 600px) {
    #celebration-content {
        padding: 30px 20px;
    }
    
    .celebration-title {
        font-size: 1.8rem;
    }
    
    .celebration-icon {
        font-size: 3rem;
    }
}

/* Темно-синий фон для завершения */
body.completed-all {
    background: linear-gradient(135deg, #0a1929 0%, #1a3a5f 100%);

}

/* Снежинки для темного фона - делаем ярче */

const RIDDLE_STATES_KEY = 'riddleStates_v1';
const YM_COUNTER_ID = 105757583;
function saveRiddleStates() {
    const riddleStates = {};

    riddles.forEach(r => {
        riddleStates[r.number] = {
            __solved: r.__solved || null,
            __answers: r.__answers || null,
            __slideSolved: r.__slideSolved || null,
            __slideAnswers: r.__slideAnswers || null
        };

    localStorage.setItem(RIDDLE_STATES_KEY, JSON.stringify(riddleStates));

// Функция отправки события в Яндекс.Метрику
function sendYMEvent(eventName, eventParams = {}) {
    if (typeof ym !== 'undefined') {
        try {
            ym(YM_COUNTER_ID, 'reachGoal', eventName, eventParams);
            console.log(`[YM] Событие отправлено: ${eventName}`, eventParams);
        } catch (error) {
            console.error('[YM] Ошибка отправки события:', error);
        }
    } else {
        console.warn('[YM] Яндекс.Метрика не загружена');
    }
}


// Функция отправки параметров визита
function sendYMUserParams() {
    if (typeof ym !== 'undefined') {
        try {
            const userId = localStorage.getItem('user_id') || 'anonymous';
            const completedCount = gameState.completedLevels.length;

            ym(YM_COUNTER_ID, 'params', {
                'User ID': userId,
                'Completed Riddles': completedCount,
                'Current Level': gameState.currentLevel,
                'Screen Resolution': `${screen.width}x${screen.height}`,
                'User Agent Short': navigator.userAgent.substring(0, 100)
            });
        } catch (error) {
            console.error('[YM] Ошибка отправки параметров:', error);
        }
    }
}

function loadRiddleStates() {
    const saved = localStorage.getItem(RIDDLE_STATES_KEY);
    if (!saved) return;

    try {
        const riddleStates = JSON.parse(saved);

        riddles.forEach(r => {
            const state = riddleStates[r.number];
            if (state) {
                r.__solved = state.__solved || null;
                r.__answers = state.__answers || null;
                r.__slideSolved = state.__slideSolved || null;
                r.__slideAnswers = state.__slideAnswers || null;

                // Автоматически помечаем загадку как решенную, если все элементы решены
                if (r.type === 'image-multi' && r.__slideSolved && r.__slideSolved.every(Boolean)) {
                    if (!gameState.completedLevels.includes(r.number)) {
                        gameState.completedLevels.push(r.number);
                    }
                }
                if (r.type === 'text-multi' && r.__solved && r.__solved.every(Boolean)) {
                    if (!gameState.completedLevels.includes(r.number)) {
                        gameState.completedLevels.push(r.number);
                    }
                }
            }
        });

        saveGameState(); // Сохраняем обновленное состояние
    } catch (e) {
        console.error("Ошибка загрузки состояний загадок:", e);
    }
}

function getCurrentMoscowDate() {
    const now = new Date();
    const moscowOffset = 3 * 60;
    const moscowTime = new Date(now.getTime() + (moscowOffset + now.getTimezoneOffset()) * 60000);
    return moscowTime;
}

function getAvailableRiddlesCount() {
    const currentDate = getCurrentMoscowDate();
    const currentDay = currentDate.getDate();
    const currentMonth = currentDate.getMonth();

    if (currentMonth !== 11) {
        return 1;
    }

    return Math.min(currentDay, riddles.length);
}

function updateAvailableLevels() {
    const availableCount = getAvailableRiddlesCount();
    gameState.currentLevel = availableCount;
}

function normalizeText(s){
    return (s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
}

function saveGameState(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(gameState));
    updateProgress();
}

function loadGameState(){
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){
        try{
            const parsed = JSON.parse(s);
            if(parsed && Array.isArray(parsed.completedLevels)) {
                gameState = parsed;
            }
        }catch(e){
            gameState = {currentLevel:1,completedLevels:[]};
        }
    }

    // Загружаем состояния загадок
    loadRiddleStates();

    updateAvailableLevels();
    updateProgress();
}

function updateProgress(){
    const completedCount = gameState.completedLevels.length;
    const totalCount = riddles.length;
    document.getElementById('completed-count').textContent = completedCount;
    document.getElementById('total-count').textContent = totalCount;
}

function createWindows(){
    const calendar=document.getElementById('calendar');
    calendar.innerHTML='';

    riddles.forEach(r=>{
        const w=document.createElement('div');
        w.className='window';

        const num=document.createElement('div');
        num.className='window-number';
        num.textContent=r.number;
        w.appendChild(num);

        // Проверяем, решена ли загадка (включая image-multi и text-multi)
        let isCompleted = gameState.completedLevels.includes(r.number);

        // Для image-multi проверяем состояние слайдов
        if (r.type === 'image-multi' && r.__slideSolved) {
            isCompleted = r.__slideSolved.every(Boolean);
        }
        // Для text-multi проверяем состояние ответов
        if (r.type === 'text-multi' && r.__solved) {
            isCompleted = r.__solved.every(Boolean);
        }

        // Устанавливаем классы стилей
        if(isCompleted) {
            w.classList.add('completed');
        } else if(r.number <= gameState.currentLevel) {
            w.classList.add('available');
        } else {
            w.classList.add('locked');
        }

        // Добавляем обработчик клика для всех доступных и решенных окон
                if(r.number <= gameState.currentLevel || isCompleted){
        w.addEventListener('click',()=>{
            // Отправляем событие клика по окну ПЕРЕД открытием
            sendYMEvent('calendar_click', {
                'window_number': r.number,
                'is_completed': isCompleted,
                'is_available': r.number <= gameState.currentLevel
            });
            openRiddle(r);
        });
        w.style.cursor = 'pointer';
    } else {
        w.title = `Эта загадка откроется ${r.number} декабря`;
        w.style.cursor = 'not-allowed';

        // Отслеживаем клики по заблокированным окнам
        w.addEventListener('click', () => {
            sendYMEvent('calendar_locked_click', {
                'window_number': r.number,
                'available_date': `${r.number} декабря`
            });
        });
    }

        const img = document.createElement('img');
        img.src = r.imageIcon;
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        img.style.pointerEvents = "none";
        w.appendChild(img);

        calendar.appendChild(w);
    });
}

function setupTextMulti(riddle) {
    const container = document.createElement('div');
    container.id = 'text-multi-container';
    container.className = 'multi-text-container';

    if (!riddle.__solved) {
        riddle.__solved = Array(riddle.items.length).fill(false);
    }
    if (!riddle.__answers) {
        riddle.__answers = Array(riddle.items.length).fill('');
    }

    riddle.items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'multi-text-item';

        const question = document.createElement('div');
        question.className = 'multi-text-question';
        question.textContent = `${index + 1}. ${item.question}`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'multi-text-input';
        input.placeholder = 'Введите ответ...';
        input.dataset.index = index;

        // Обрабатываем как answer (строка), так и answers (массив)
        const correctAnswers = Array.isArray(item.answers) ? item.answers : [item.answer];
        input.dataset.correctAnswer = correctAnswers.join('|');

        if (riddle.__answers[index]) {
            input.value = riddle.__answers[index];
            if (riddle.__solved[index]) {
                input.classList.add('correct');
                input.readOnly = true;
            }
        }

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const index = parseInt(this.dataset.index);
                const userAnswer = normalizeText(this.value);
                const correctAnswers = this.dataset.correctAnswer.split('|').map(a => normalizeText(a));

                const oldMessage = this.parentNode.querySelector('.input-result');
                if (oldMessage) oldMessage.remove();

                if (userAnswer && correctAnswers.includes(userAnswer)) {
                    this.classList.add('correct');
                    this.classList.remove('incorrect');
                    this.readOnly = true;
                    riddle.__solved[index] = true;
                    riddle.__answers[index] = this.value;

                    // Сохраняем состояние
                    saveRiddleStates();

                    showInputResult(this, '✅ Верно!', 'success');

                    const nextInput = document.querySelector(`.multi-text-input[data-index="${index + 1}"]`);
                    if (nextInput && !nextInput.readOnly) {
                        nextInput.focus();
                    } else {
                        if (riddle.__solved.every(Boolean)) {
                            markSolved(riddle);
                            showSuccess();
                        }
                    }
                } else if (userAnswer) {
                    this.classList.add('incorrect');
                    this.classList.remove('correct');
                    showInputResult(this, '❌ Неверно', 'error');
                }
            }
        });

        itemDiv.appendChild(question);
        itemDiv.appendChild(input);
        container.appendChild(itemDiv);
    });

    const checkButton = document.createElement('button');
    checkButton.className = 'submit-button';
    checkButton.textContent = 'Проверить все ответы';
    checkButton.onclick = () => checkTextMultiAnswers(riddle);
    container.appendChild(checkButton);

    document.getElementById('text-multi-section').appendChild(container);
    document.getElementById('text-multi-section').style.display = 'block';
}

function checkTextMultiAnswers(riddle) {
    const inputs = document.querySelectorAll('.multi-text-input');
    let allCorrect = true;

    inputs.forEach((input, index) => {
        const userAnswer = normalizeText(input.value);
        const correctAnswers = input.dataset.correctAnswer.split('|').map(a => normalizeText(a));

        riddle.__answers[index] = input.value;

        const oldMessage = input.parentNode.querySelector('.input-result');
        if (oldMessage) oldMessage.remove();

        // Проверяем только если пользователь ввел ответ
        if (userAnswer !== '') {
            if (correctAnswers.includes(userAnswer)) {
                input.classList.add('correct');
                input.classList.remove('incorrect');
                input.readOnly = true;
                riddle.__solved[index] = true;
                showInputResult(input, '✅ Верно!', 'success');
            } else {
                input.classList.add('incorrect');
                input.classList.remove('correct');
                allCorrect = false;
                riddle.__solved[index] = false;
                showInputResult(input, '❌ Неверно', 'error');
            }
        }
    });

    // Сохраняем состояние
    saveRiddleStates();

    // Проверяем, ВСЕ ли ответы заполнены и правильны
    const allAnswered = Array.from(inputs).every(input => normalizeText(input.value) !== '');
    const allSolved = riddle.__solved.every(Boolean);

    if (allAnswered && allSolved) {
        markSolved(riddle);
        showSuccess();
    }
}

function checkCurrentSlide() {
    const r = window.sliderRiddle;
    if (!r) return;

    const idx = window.sliderIndex;
    const input = document.getElementById('slider-answer');
    const resultContainer = document.getElementById('slide-result-container');

    if (!input || !resultContainer) return;

    const val = normalizeText(input.value);
    if (!val) {
        showSlideResult('Введите ответ', 'neutral');
        return;
    }

    // Сохраняем ответ для текущего слайда
    r.__slideAnswers[idx] = input.value;

    // Проверяем ответ для конкретного слайда
    const accepted = (r.items[idx].answers || []).map(a => normalizeText(a));

    if (accepted.includes(val)) {
        // Помечаем только текущий слайд как решенный
        r.__slideSolved[idx] = true;

        // Блокируем ввод для этого слайда
        input.style.borderColor = '#33cc33';
        input.style.background = 'rgba(76, 175, 80, 0.1)';
        input.placeholder = '✅ Верно!';
        input.readOnly = true;

        // Показываем успех
        showSlideResult('✅ Верно!', 'success');
        sendYMEvent('slide_solved', {
            'riddle_number': r.number,
            'slide_index': idx + 1,
            'total_slides': r.items.length,
            'answer_length': val.length,
            'is_correct': true
        });
        // Скрываем кнопку проверки для этого слайда
        const checkBtn = document.querySelector('#slider-input-wrap .submit-button');
        if (checkBtn) {
            checkBtn.style.display = 'none';
        }

        // Сохраняем состояние
        saveRiddleStates();
        updateModalTitle(r);
        // Проверяем, все ли слайды решены
        setTimeout(() => {
            if (r.__slideSolved.every(Boolean)) {
                markSolved(r);
                showSuccess();
            } else {
                // Автоматически переходим к следующему НЕРЕШЕННОМУ слайду
                moveToNextUnsolved();
            }
        }, 800);

    } else {
        input.style.borderColor = '#ff3333';
        input.style.background = 'rgba(244, 67, 54, 0.1)';
        showSlideResult('❌ Неверно. Попробуйте ещё.', 'error');
        sendYMEvent('slide_failed', {
            'riddle_number': r.number,
            'slide_index': idx + 1,
            'answer_length': val.length,
            'is_correct': false
        });
    }
}

function moveToNextUnsolved() {
    const r = window.sliderRiddle;
    if (!r || !r.__slideSolved) return;

    const currentIdx = window.sliderIndex;
    let nextIdx = currentIdx;

    // Ищем следующий нерешенный слайд
    for (let i = 1; i <= r.items.length; i++) {
        const checkIdx = (currentIdx + i) % r.items.length;
        if (!r.__slideSolved[checkIdx]) {
            nextIdx = checkIdx;
            break;
        }
    }

    // Переключаемся на найденный слайд
    if (nextIdx !== currentIdx) {
        window.sliderIndex = nextIdx;
        updateSlider();
    }
}



function updateSlider(){
    const r = window.sliderRiddle;
    const idx = window.sliderIndex;

    if(!r) return;
    const img = document.getElementById('slider-main-image');
    if (img && r.items[idx]) {
        img.src = r.items[idx].image;
    }

    const input = document.getElementById('slider-answer');
    const checkBtn = document.querySelector('#slider-input-wrap .submit-button');
    const resultContainer = document.getElementById('slide-result-container');

    if(!input || !checkBtn || !resultContainer) return;

    // Очищаем предыдущий результат
    resultContainer.style.display = 'none';
    resultContainer.innerHTML = '';

    // Устанавливаем значение из сохраненных ответов
    input.value = r.__slideAnswers[idx] || '';

    // Настраиваем состояние поля ввода
    if (r.__slideSolved && r.__slideSolved[idx]) {
        input.style.borderColor = '#33cc33';
        input.style.background = 'rgba(76, 175, 80, 0.1)';
        input.placeholder = '✅ Верно!';
        input.readOnly = true;
        checkBtn.style.display = 'none';
    } else {
        input.style.borderColor = 'rgba(255,255,255,0.3)';
        input.style.background = 'rgba(255,255,255,0.1)';
        input.placeholder = 'Ответ к этой картинке...';
        input.readOnly = false;
        checkBtn.style.display = 'block';
        checkBtn.textContent = 'Проверить этот ответ';
    }

    updateModalTitle(r);

    }


function updateModalTitle(r) {
    const modalTitle = document.querySelector('.modal h2');
    if (!modalTitle) return;

    let title = `Загадка ${r.number}`;

    // Показываем прогресс только для image-multi и text-multi
    if (r.type === 'image-multi') {
        if (r.__slideSolved && r.items && r.items.length > 0) {
            const solvedCount = r.__slideSolved.filter(Boolean).length;
            title += ` - ${solvedCount}/${r.items.length}${solvedCount === r.items.length ? '✅' : ''}`;
        }
    }
    else if (r.type === 'text-multi') {
        if (r.__solved && r.items && r.items.length > 0) {
            const solvedCount = r.__solved.filter(Boolean).length;
            title += ` - ${solvedCount}/${r.items.length}${solvedCount === r.items.length ? '✅' : ''}`;
        }
    }

    modalTitle.textContent = title;
}

function checkAnswer(){
    const r=window.currentRiddle;
    if (!r) return;

    // Обработка image-multi перенаправляется в checkCurrentSlide
    if(r.type === 'image-multi'){
        checkCurrentSlide();
        return;
    }

    // Для всех остальных типов загадок
    const input = document.getElementById('answer-input');
    if (!input) return;

    const val = normalizeText(input.value);
    if(!val) return;

    let accepted = [];
    if (Array.isArray(r.answers)) {
        // Новый формат: riddle с answers массивом
        accepted = r.answers;
    } else if (Array.isArray(r.answer)) {
        // Старый формат: riddle с answer массивом
        accepted = r.answer;
    } else if (r.answer) {
        // Старый формат: riddle с answer строкой
        accepted = [r.answer];
    } else {
        // На всякий случай
        accepted = [];
    }
    
    const normalizedAccepted = accepted.map(a => normalizeText(a));

    if(normalizedAccepted.includes(val)){
        markSolved(r);
        showSuccess();
        sendYMEvent('answer_correct', {
            'riddle_number': r.number,
            'riddle_type': r.type,
            'answer_length': val.length,
            'attempts': r.__attempts ? r.__attempts + 1 : 1
        });
    } else {
        // Отправляем событие неудачной попытки
        sendYMEvent('answer_incorrect', {
            'riddle_number': r.number,
            'riddle_type': r.type,
            'answer_length': val.length,
            'attempts': r.__attempts ? r.__attempts + 1 : 1
        });

        // Считаем попытки
        if (!r.__attempts) r.__attempts = 0;
        r.__attempts++;

        showError();

    }
}

function setupMatch(r){
    const list=document.getElementById('match-list');
    const slots=document.getElementById('match-slots');
    list.innerHTML='';
    slots.innerHTML='';

    const facts = r.pairs.map(p=>p.fact).sort(()=>Math.random()-0.5);
    const countries = r.pairs.map(p=>p.country).sort(()=>Math.random()-0.5);

    facts.forEach(f=>{
        const d=document.createElement('div');
        d.className='match-item';
        d.draggable=true;
        d.textContent=f;
        d.dataset.fact=f;
        d.addEventListener('dragstart',e=>{
            e.dataTransfer.setData('text/plain',f);
        });
        list.appendChild(d);
    });

    countries.forEach(c=>{
        const s=document.createElement('div');
        s.className='match-slot';
        s.textContent=c;
        s.dataset.country=c;
        s.addEventListener('dragover',e=>e.preventDefault());
        s.addEventListener('drop',e=>{
            const fact=e.dataTransfer.getData('text/plain');
            if(fact){
                s.innerHTML= c + '<div style="margin-top:6px;background:#fff;color:#222;padding:6px;border-radius:6px;">'+fact+'</div>';
                s.dataset.assigned=fact;
            }
        });
        slots.appendChild(s);
    });
}

function checkMatch(){
    const r=window.currentRiddle;
    const slots=document.querySelectorAll('#match-slots .match-slot');
    let ok=true;

    r.pairs.forEach(p=>{
        const slot=Array.from(slots).find(s=>s.dataset.country===p.country);
        if(!slot || slot.dataset.assigned!==p.fact) ok=false;
    });

    if(ok){
        markSolved(r);
        showSuccess();
    } else {
        showError();
    }
}

function setupMultiAudio(riddle) {
    const container = document.createElement('div');
    container.id = 'audio-multi-container';
    container.className = 'multi-text-container';

    if (!riddle.__solved) {
        riddle.__solved = Array(riddle.items.length).fill(false);
    }
    if (!riddle.__answers) {
        riddle.__answers = Array(riddle.items.length).fill('');
    }

    riddle.items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'multi-text-item';

        // Контейнер для аудиоплеера
        const audioContainer = document.createElement('div');
        audioContainer.className = 'audio-container';

        // Аудиоплеер
        const playerDiv = document.createElement('div');
        playerDiv.className = 'audio-player';

        // Заголовок аудио (номер)
        const audioTitle = document.createElement('div');
        audioTitle.className = 'audio-title';
        audioTitle.textContent = `Аудио ${index + 1}`;
        playerDiv.appendChild(audioTitle);

        // Элементы управления
        const controls = document.createElement('div');
        controls.className = 'audio-controls';

        // Кнопка воспроизведения
        const playBtn = document.createElement('button');
        playBtn.className = 'audio-play-btn';
        playBtn.innerHTML = '▶';
        playBtn.dataset.index = index;

        // Прогресс-бар
        const progress = document.createElement('div');
        progress.className = 'audio-progress';
        const progressBar = document.createElement('div');
        progressBar.className = 'audio-progress-bar';
        progress.appendChild(progressBar);

        // Время
        const timeDisplay = document.createElement('div');
        timeDisplay.className = 'audio-time';
        timeDisplay.textContent = '0:00 / 0:00';

        controls.appendChild(playBtn);
        controls.appendChild(progress);
        controls.appendChild(timeDisplay);
        playerDiv.appendChild(controls);

        // Аудио элемент (скрытый)
        const audio = document.createElement('audio');
        audio.src = item.audio;
        audio.preload = 'metadata';
        audio.dataset.index = index;

        // Поле для ввода ответа
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'multi-text-input';
        input.placeholder = 'Что вы услышали? Введите ответ...';
        input.dataset.index = index;

        // Обрабатываем как answer (строка), так и answers (массив)
        const correctAnswers = Array.isArray(item.answers) ? item.answers : [item.answer];
        input.dataset.correctAnswer = correctAnswers.join('|');

        if (riddle.__answers[index]) {
            input.value = riddle.__answers[index];
            if (riddle.__solved[index]) {
                input.classList.add('correct');
                input.readOnly = true;
                playBtn.disabled = true;
                playBtn.style.opacity = '0.5';
            }
        }

        // Обработка воспроизведения аудио
        playBtn.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            const allAudios = document.querySelectorAll('audio');
            
            // Останавливаем все другие аудио
            allAudios.forEach(a => {
                if (a.dataset.index != idx) {
                    a.pause();
                    a.currentTime = 0;
                    const otherBtn = document.querySelector(`.audio-play-btn[data-index="${a.dataset.index}"]`);
                    if (otherBtn) {
                        otherBtn.innerHTML = '▶';
                        otherBtn.classList.remove('playing');
                    }
                }
            });

            if (audio.paused) {
                audio.play();
                this.innerHTML = '⏸';
                this.classList.add('playing');
            } else {
                audio.pause();
                this.innerHTML = '▶';
                this.classList.remove('playing');
            }
        });

        // Обновление прогресса
        audio.addEventListener('timeupdate', function() {
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progressPercent + '%';
            
            const currentTime = formatTime(audio.currentTime);
            const duration = formatTime(audio.duration);
            timeDisplay.textContent = `${currentTime} / ${duration}`;
        });

        // Сброс кнопки при окончании воспроизведения
        audio.addEventListener('ended', function() {
            const btn = document.querySelector(`.audio-play-btn[data-index="${this.dataset.index}"]`);
            if (btn) {
                btn.innerHTML = '▶';
                btn.classList.remove('playing');
            }
        });

        // Клик по прогресс-бару для перемотки
        progress.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // Проверка ответа при нажатии Enter
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const idx = parseInt(this.dataset.index);
                const userAnswer = normalizeText(this.value);
                const correctAnswers = this.dataset.correctAnswer.split('|').map(a => normalizeText(a));

                const oldMessage = this.parentNode.querySelector('.input-result');
                if (oldMessage) oldMessage.remove();

                if (userAnswer && correctAnswers.includes(userAnswer)) {
                    this.classList.add('correct');
                    this.classList.remove('incorrect');
                    this.readOnly = true;
                    riddle.__solved[idx] = true;
                    riddle.__answers[idx] = this.value;

                    // Отключаем кнопку воспроизведения
                    const playBtn = document.querySelector(`.audio-play-btn[data-index="${idx}"]`);
                    if (playBtn) {
                        playBtn.disabled = true;
                        playBtn.style.opacity = '0.5';
                    }

                    // Останавливаем аудио
                    const audio = document.querySelector(`audio[data-index="${idx}"]`);
                    if (audio) {
                        audio.pause();
                        audio.currentTime = 0;
                    }

                    // Сохраняем состояние
                    saveRiddleStates();

                    showInputResult(this, '✅ Верно!', 'success');

                    // Переход к следующему нерешенному
                    const nextIndex = idx + 1;
                    if (nextIndex < riddle.items.length) {
                        const nextInput = document.querySelector(`.multi-text-input[data-index="${nextIndex}"]`);
                        const nextAudio = document.querySelector(`audio[data-index="${nextIndex}"]`);
                        if (nextInput && !nextInput.readOnly) {
                            nextInput.focus();
                            // Автовоспроизведение следующего аудио
                            if (nextAudio) {
                                setTimeout(() => {
                                    nextAudio.play();
                                    const nextBtn = document.querySelector(`.audio-play-btn[data-index="${nextIndex}"]`);
                                    if (nextBtn) {
                                        nextBtn.innerHTML = '⏸';
                                        nextBtn.classList.add('playing');
                                    }
                                }, 500);
                            }
                        }
                    } else {
                        if (riddle.__solved.every(Boolean)) {
                            markSolved(riddle);
                            showSuccess();
                        }
                    }
                } else if (userAnswer) {
                    this.classList.add('incorrect');
                    this.classList.remove('correct');
                    showInputResult(this, '❌ Неверно', 'error');
                }
            }
        });

        audioContainer.appendChild(playerDiv);
        audioContainer.appendChild(audio);
        
        itemDiv.appendChild(audioContainer);
        itemDiv.appendChild(input);
        container.appendChild(itemDiv);
    });

    // Кнопка проверки всех ответов
    const checkButton = document.createElement('button');
    checkButton.className = 'submit-button';
    checkButton.textContent = 'Проверить все ответы';
    checkButton.onclick = () => checkMultiAudioAnswers(riddle);
    container.appendChild(checkButton);

    document.getElementById('text-multi-section').appendChild(container);
    document.getElementById('text-multi-section').style.display = 'block';
}

// Вспомогательная функция для форматирования времени
function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Функция проверки всех ответов для multi-audio
function checkMultiAudioAnswers(riddle) {
    const inputs = document.querySelectorAll('.multi-text-input');
    let allCorrect = true;

    inputs.forEach((input, index) => {
        const userAnswer = normalizeText(input.value);
        const correctAnswers = input.dataset.correctAnswer.split('|').map(a => normalizeText(a));

        riddle.__answers[index] = input.value;

        const oldMessage = input.parentNode.querySelector('.input-result');
        if (oldMessage) oldMessage.remove();

        if (userAnswer !== '') {
            if (correctAnswers.includes(userAnswer)) {
                input.classList.add('correct');
                input.classList.remove('incorrect');
                input.readOnly = true;
                riddle.__solved[index] = true;

                // Отключаем кнопку воспроизведения
                const playBtn = document.querySelector(`.audio-play-btn[data-index="${index}"]`);
                if (playBtn) {
                    playBtn.disabled = true;
                    playBtn.style.opacity = '0.5';
                }

                // Останавливаем аудио
                const audio = document.querySelector(`audio[data-index="${index}"]`);
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }

                showInputResult(input, '✅ Верно!', 'success');
            } else {
                input.classList.add('incorrect');
                input.classList.remove('correct');
                allCorrect = false;
                riddle.__solved[index] = false;
                showInputResult(input, '❌ Неверно', 'error');
            }
        }
    });

    // Сохраняем состояние
    saveRiddleStates();

    // Проверяем, все ли ответы заполнены и правильны
    const allAnswered = Array.from(inputs).every(input => normalizeText(input.value) !== '');
    const allSolved = riddle.__solved.every(Boolean);

    if (allAnswered && allSolved) {
        markSolved(riddle);
        showSuccess();
    }
}

function setupWordsearch(r){
    ws_selected=[];
    ws_found=new Set();

    const gridDiv=document.getElementById('grid');
    gridDiv.innerHTML='';

    const wordListDiv = document.getElementById('word-list');
    wordListDiv.innerHTML = '';

    const showWordsBtn = document.createElement('button');
    showWordsBtn.className = 'show-words-btn';
    showWordsBtn.textContent = 'Показать слова, которые надо найти';
    showWordsBtn.onclick = function() {
        createWordList(r);
        showWordsBtn.style.display = 'none';
    };

    const wordsContainer = document.createElement('div');
    wordsContainer.id = 'words-container';
    wordsContainer.style.display = 'none';

    wordListDiv.appendChild(showWordsBtn);
    wordListDiv.appendChild(wordsContainer);

    for(let i=0;i<100;i++){
        const cell=document.createElement('div');
        cell.className='cell';
        cell.textContent=r.grid[i];
        cell.dataset.index=i;
        cell.addEventListener('click',()=>{toggleCell(cell)});
        gridDiv.appendChild(cell);
    }
}

function createWordList(r) {
    const wordsContainer = document.getElementById('words-container');
    wordsContainer.style.display = 'block';
    wordsContainer.innerHTML = '';

    r.words.forEach(w=>{
        const el=document.createElement('div');
        el.textContent=w;
        el.style.margin='4px';
        el.style.display='inline-block';
        el.style.padding='4px 8px';
        el.style.background='rgba(255,255,255,.1)';
        el.style.borderRadius='6px';
        el.dataset.word=w;
        if(ws_found.has(w)) {
            el.style.textDecoration='line-through';
            el.style.background = 'rgba(76, 175, 80, 0.3)';
        }
        wordsContainer.appendChild(el);
    });
}

function toggleCell(cell){
    if(cell.classList.contains('found')) return;
    const idx=parseInt(cell.dataset.index);

    if(ws_selected.length && !isAdjacent(ws_selected[ws_selected.length-1],idx) && ws_selected.length>0){
        clearSelection();
    }

    if(cell.classList.contains('selected')){
        cell.classList.remove('selected');
        ws_selected=ws_selected.filter(i=>i!==idx);
    } else {
        cell.classList.add('selected');
        ws_selected.push(idx);
    }
}

function isAdjacent(a,b){
    const ax=a%10, ay=Math.floor(a/10), bx=b%10, by=Math.floor(b/10);
    return Math.abs(ax-bx)<=1 && Math.abs(ay-by)<=1;
}

function submitWord(){
    const r=window.currentRiddle;
    if(ws_selected.length<2) return;

    const letters=ws_selected.map(i=>r.grid[i]).join('').toLowerCase();
    const rev=letters.split('').reverse().join('');
    const match = r.words.find(w=>w.toLowerCase()===letters || w.toLowerCase()===rev);

    if(match && !ws_found.has(match)){
        ws_selected.forEach(i=>{
            const cell=document.querySelector('.cell[data-index="'+i+'"]');
            if(cell) {
                cell.classList.remove('selected');
                cell.classList.add('found');
            }
        });

        ws_found.add(match);

        const wordsContainer = document.getElementById('words-container');
        if (wordsContainer && wordsContainer.style.display !== 'none') {
            Array.from(wordsContainer.querySelectorAll('[data-word]')).forEach(el=>{
                if(el.dataset.word.toLowerCase()===match.toLowerCase()) {
                    el.style.textDecoration='line-through';
                    el.style.background = 'rgba(76, 175, 80, 0.3)';
                }
            });
        }

        ws_selected=[];

        if(ws_found.size===r.words.length){
            markSolved(r);
            showSuccess();
        }
    } else {
        showError();
        clearSelection();
    }
}

function clearSelection(){
    ws_selected.forEach(i=>{
        const cell=document.querySelector('.cell[data-index="'+i+'"]');
        if(cell) cell.classList.remove('selected');
    });
    ws_selected=[];
}

let group_selected=[];
function setupGroups(r){
    const grid=document.getElementById('groups-grid');
    grid.innerHTML='';
    group_selected=[];

    r.items.forEach(it=>{
        const el=document.createElement('div');
        el.className='group-item';
        el.textContent=it;
        el.addEventListener('click',()=>{
            if(el.classList.contains('selected')){
                el.classList.remove('selected');
                group_selected=group_selected.filter(x=>x!==it);
            } else {
                el.classList.add('selected');
                group_selected.push(it);
            }

            if(group_selected.length>4){
                const first=group_selected.shift();
                Array.from(document.querySelectorAll('.group-item')).find(x=>x.textContent===first).classList.remove('selected');
            }
        });
        grid.appendChild(el);
    });
}

function resetProgress() {
    if (confirm('Вы уверены, что хотите сбросить весь прогресс? Это действие нельзя отменить.')) {
        // Сброс состояния игры
        gameState = {
            currentLevel: 1,
            completedLevels: []
        };

        // Сброс состояний загадок
        riddles.forEach(r => {
            r.__solved = null;
            r.__answers = null;
            r.__slideSolved = null;
            r.__slideAnswers = null;
        });

        // Очистка localStorage
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(RIDDLE_STATES_KEY);

        // Обновление интерфейса
        updateAvailableLevels();
        updateProgress();
        createWindows();

        // Закрытие модального окна, если оно открыто
        closeModal();

        alert('Прогресс успешно сброшен!');
    }
}

function checkGroups(){
    const r=window.currentRiddle;
    if(group_selected.length!==4){
        alert('Выберите 4 элемента для проверки одной группы');
        return;
    }

    const normalized = group_selected.slice().sort().join('|');
    const possible = r.groups.map(g=>g.slice().sort().join('|'));
    const idx = possible.indexOf(normalized);

    if(idx>-1){
        r.groups.splice(idx,1);
        Array.from(document.querySelectorAll('.group-item')).forEach(el=>{
            if(group_selected.includes(el.textContent)){
                el.style.opacity='.4';
                el.style.pointerEvents='none';
                el.classList.remove('selected');
            }
        });

        group_selected=[];

        if(r.groups.length===0){
            markSolved(r);
            showSuccess();
        } else {
            showSuccess();
        }
    } else {
        showError();
    }
}

function startSnowfall() {
    const container = document.getElementById('snowfall-container');
    if (!container) return;
    
    container.innerHTML = '';
    
    // Создаем снежинки (разные типы для разнообразия)
    const snowflakes = ['❄', '❅', '❆', '✦', '✶', '•', '·'];
    const numSnowflakes = 120; // Немного больше снежинок
    
    for (let i = 0; i < numSnowflakes; i++) {
        const snowflake = document.createElement('div');
        snowflake.className = 'snowflake';
        snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
        
        // Случайные параметры для естественного вида
        const left = Math.random() * 100;
        const size = Math.random() * 1.5 + 0.8;
        const duration = Math.random() * 10 + 8;
        const delay = Math.random() * 5;
        const opacity = Math.random() * 0.5 + 0.5;
        
        // Немного покачивания из стороны в сторону
        const sway = Math.random() * 20 - 10;
        
        snowflake.style.left = `${left}%`;
        snowflake.style.fontSize = `${size}em`;
        snowflake.style.animation = `snowfall ${duration}s linear ${delay}s infinite`;
        snowflake.style.opacity = opacity;
        
        // Добавляем индивидуальную анимацию для каждой снежинки
        const style = document.createElement('style');
        style.textContent = `
            @keyframes snowfall_${i} {
                0% {
                    transform: translateY(0) translateX(0) rotate(0deg);
                    opacity: ${opacity};
                }
                100% {
                    transform: translateY(100vh) translateX(${sway}px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        snowflake.style.animation = `snowfall_${i} ${duration}s linear ${delay}s infinite`;
        
        container.appendChild(snowflake);
    }
}

function checkAllRiddlesSolved() {
    const totalRiddles = riddles.length;

    
    // Проверяем все загадки
    for (let i = 0; i < riddles.length; i++) {
        const r = riddles[i];
        
        // Проверяем, решена ли загадка
        if (!gameState.completedLevels.includes(r.number)) {
            return false;
        }
        
        // Дополнительная проверка для image-multi
        if (r.type === 'image-multi') {
            if (!r.__slideSolved || !r.__slideSolved.every(Boolean)) {
                return false;
            }
        }
        
        // Дополнительная проверка для text-multi
        if (r.type === 'text-multi') {
            if (!r.__solved || !r.__solved.every(Boolean)) {
                return false;
            }
        }
        
        // Дополнительная проверка для multi-audio
        if (r.type === 'multi-audio') {
            if (!r.__solved || !r.__solved.every(Boolean)) {
                return false;
            }
        }
    }
    
    return true;
}
